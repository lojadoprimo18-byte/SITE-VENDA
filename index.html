        .header-content {

        .contato-whatsapp {

            background: var(--green); color: white; padding: 13px 18px; border-radius: 12px;
            text-decoration: none; font-weight: 750; font-size: 13px; white-space: nowrap;
            transition: transform .2s, background .2s, box-shadow .2s;
            box-shadow: 0 5px 14px rgba(22,167,101,.18);
        }
        .contato-whatsapp:hover { background: #118d55; transform: translateY(-1px); box-shadow: 0 8px 18px rgba(22,167,101,.24); }

        .categorias-container { background: white; border-top: 1px solid #edf1f6; padding: 9px 28px 12px; }

            overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;

        .btn-categoria {
            border: 1px solid transparent; background: transparent; color: #58667a;
            padding: 10px 17px; border-radius: 999px; cursor: pointer; font-weight: 650;
            font-size: 12px; white-space: nowrap; flex-shrink: 0; transition: all .2s;
        }
        .btn-categoria:hover { background: #f0f5fc; color: var(--navy); }
        .btn-categoria.ativo { color: white; background: var(--navy); box-shadow: 0 4px 10px rgba(11,52,114,.18); }
        .container {
            max-width: 1320px; margin: 0 auto; padding: 30px 28px 56px;
            display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px;
        }
        .produto-card {
            min-width: 0; background: var(--surface); border: 1px solid var(--line);
            border-radius: 18px; padding: 14px; display: flex; flex-direction: column;
            box-shadow: 0 3px 12px rgba(16,39,74,.035);
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;

        // ==========================================
        // FUNÇÕES
        // ==========================================
        const container = document.getElementById('lista-produtos');
        const inputBusca = document.getElementById('busca');
        const mensagemVazio = document.getElementById('mensagem-vazio');
        let categoriaAtual = 'todos';
        let termoBusca = '';

        function renderizarProdutos(lista) {
            container.innerHTML = '';

            if (lista.length === 0) {
                mensagemVazio.style.display = 'block';
                return;
            }

            mensagemVazio.style.display = 'none';

            lista.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'produto-card';

                let precoHTML = '';
                if (produto.precoAntigo) {
                    precoHTML = `
                        <div class="produto-preco-container">
                            <span class="preco-antigo">De: ${produto.precoAntigo}</span>
                            <span class="produto-preco">Por: ${produto.preco}</span>
                            ${produto.desconto ? `<span class="badge-desconto">${produto.desconto}</span>` : ''}
                        </div>
                    `;
                } else {
                    precoHTML = `
                        <div class="produto-preco-container">
                            <span class="produto-preco">${produto.preco}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="imagem-container">
                        <img src="${produto.imagem}" 
                             alt="${produto.nome}" 
                             class="produto-imagem"
                             loading="lazy"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23f0f2f5%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2230%22 y=%2250%22 fill=%22%23999%22 font-size=%2210%22 font-family=%22Arial%22%3ESem imagem%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="produto-info">
                        <h3 class="produto-titulo">${produto.nome}</h3>
                        ${precoHTML}
                        <a href="${produto.link}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
                            <i class="fab fa-whatsapp"></i> Pedir no WhatsApp
                        </a>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function filtrarProdutos() {
            const termo = termoBusca.toLowerCase().trim();
            
            const filtrados = produtos.filter(produto => {
                const nomeMatch = produto.nome.toLowerCase().includes(termo);
                const categoriaMatch = categoriaAtual === 'todos' || produto.categoria === categoriaAtual;
                return nomeMatch && categoriaMatch;
            });

            renderizarProdutos(filtrados);
        }

        // ==========================================
        // EVENTOS
        // ==========================================

        inputBusca.addEventListener('input', (e) => {
            termoBusca = e.target.value;
            filtrarProdutos();
        });

        document.querySelector('.categorias').addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-categoria');
            if (!btn) return;

            document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');

            categoriaAtual = btn.dataset.categoria;
            filtrarProdutos();
        });

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        renderizarProdutos(produtos);
    </script>
